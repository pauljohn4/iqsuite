<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>License Overview</title>
    <style>
        body {
            font-family: 'Montserrat', sans-serif;
            background: linear-gradient(150deg, #0F6D65, #F7F7F3);
            color: #333;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px;
        }

        h2 {
            color: #0F6D65;
            margin-bottom: 20px;
        }

        table {
            width: 90%;
            border-collapse: collapse;
            background: white;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
        }

        th,
        td {
            padding: 12px 15px;
            text-align: left;
        }

        th {
            background-color: #0F6D65;
            color: white;
        }

        tr:nth-child(even) {
            background-color: #f9f9f9;
        }

        tr:hover {
            background-color: #e6f7f5;
        }

        .no-data {
            color: #555;
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
        }

        a {
            text-decoration: none;
            color: #0F6D65;
            font-weight: bold;
            margin-top: 20px;
        }
    </style>
</head>

<body>
    <h2>License Overview</h2>

    {% if users %}
    <table>
        <thead>
            <tr>
                <th>Username</th>
                <th>Modules Licensed</th>
                <th>Install No</th>
            </tr>
        </thead>
        <tbody>
            {% for user in users %}
            <tr>
                <td>{{ user.username }}</td>
                <td>{{ user.modules }}</td>
                <td>{{ user.install_no }}</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
    {% else %}
    <div class="no-data">No data available or XML could not be read.</div>
    {% endif %}

    <a href="/">← Back to Dashboard</a>
</body>

</html>
